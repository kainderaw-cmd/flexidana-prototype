<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="FlexiDana - Prototype Pembiayaan (Properti Film). KTP + Verifikasi Wajah (simulasi)." />
  <meta name="theme-color" content="#00D154" />
  <title>FlexiDana - Prototype (Properti Film)</title>

  <style>
    /* Minimal styling for prototype */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{background:#0f172a;color:#0f172a;display:flex;justify-content:center;padding:12px}
    .app{width:100%;max-width:430px;background:#FBF9F1;min-height:100vh;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
    header{padding:18px;display:flex;justify-content:space-between;align-items:center}
    .card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eef2f7;box-shadow:0 6px 18px rgba(2,6,23,.06)}
    .hidden{display:none}
    button{cursor:pointer}
    input,select,textarea{font:inherit}
    video,img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#0f172a}
    .center{display:flex;align-items:center;justify-content:center}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;z-index:2000}
    .modal{width:92%;max-width:420px;background:#fff;border-radius:16px;padding:16px;max-height:90vh;overflow:auto}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div>
        <h1 style="margin:0;font-size:20px;font-weight:800">flexidana</h1>
        <div style="font-size:12px;color:#6b7280">Prototype Pembiayaan Digital • OJK (Properti Film)</div>
      </div>
      <div>
        <button id="btn-open-notif" title="Notifikasi" style="background:#fff;border-radius:10px;padding:8px;border:0">🔔</button>
      </div>
    </header>

    <!-- LOGIN FLOW -->
    <main style="padding:16px;flex:1;overflow:auto">
      <section id="login-flow" class="card" style="display:block">
        <label style="font-weight:700;font-size:12px;display:block;margin-bottom:8px">Nomor Handphone</label>
        <div style="display:flex;gap:8px">
          <span style="background:#f1f5f9;padding:8px;border-radius:10px;font-weight:700">+62</span>
          <input id="login-input-phone" type="tel" inputmode="tel" placeholder="81234567890" style="flex:1;padding:10px;border-radius:10px;border:1px solid #e6eef0" />
        </div>
        <button id="btn-send-otp" style="width:100%;margin-top:12px;padding:12px;background:#00D154;color:#fff;border-radius:10px;border:0;font-weight:800">Kirim Kode OTP</button>

        <div id="login-otp" class="hidden" style="margin-top:14px">
          <label style="font-weight:700;font-size:12px;display:block;margin-bottom:8px">Masukkan Kode OTP</label>
          <div style="display:flex;gap:8px">
            <input maxlength="1" class="otp-digit" style="width:48px;height:48px;border-radius:10px;border:1px solid #e6eef0;text-align:center;font-weight:800" />
            <input maxlength="1" class="otp-digit" style="width:48px;height:48px;border-radius:10px;border:1px solid #e6eef0;text-align:center;font-weight:800" />
            <input maxlength="1" class="otp-digit" style="width:48px;height:48px;border-radius:10px;border:1px solid #e6eef0;text-align:center;font-weight:800" />
            <input maxlength="1" class="otp-digit" style="width:48px;height:48px;border-radius:10px;border:1px solid #e6eef0;text-align:center;font-weight:800" />
          </div>
          <button id="btn-verify-otp" style="width:100%;margin-top:12px;padding:12px;background:#00D154;color:#fff;border-radius:10px;border:0;font-weight:800">Verifikasi & Masuk</button>
        </div>

        <div style="text-align:center;margin-top:10px;font-size:12px;color:#6b7280">
          <button id="btn-bypass" style="background:none;border:0;color:#6b7280;text-decoration:underline;cursor:pointer">Bypass ke lobby (syuting)</button>
        </div>
      </section>

      <!-- ONBOARDING -->
      <section id="onboarding-flow" class="card hidden" style="margin-top:16px">
        <h3 style="margin:0 0 8px 0">Verifikasi KTP & Wajah (Simulasi)</h3>

        <div>
          <label style="font-weight:700;font-size:12px;display:block;margin-bottom:8px">Unggah/ambil foto e-KTP</label>
          <div style="position:relative">
            <video id="onboard-ktp-video" autoplay playsinline muted class=""></video>
            <img id="onboard-ktp-preview" class="hidden" alt="KTP preview" />
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <label style="flex:1;background:#f8fafc;padding:10px;border-radius:10px;text-align:center;cursor:pointer">
              Unggah dari Galeri
              <input id="ktp-file" type="file" accept="image/*" style="display:none" />
            </label>
            <button id="btn-ktp-camera" style="padding:10px;border-radius:10px;background:#ecfdf5;border:0">Kamera</button>
          </div>
        </div>

        <hr style="margin:12px 0;border:none;border-top:1px solid #eef2f7" />

        <div>
          <label style="font-weight:700;font-size:12px;display:block;margin-bottom:8px">Verifikasi Wajah</label>
          <div style="position:relative">
            <video id="onboard-face-video" autoplay playsinline muted class=""></video>
            <canvas id="face-analysis-canvas" class="hidden"></canvas>
            <div id="face-liveness-oval" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:160px;border:4px solid #f59e0b;border-radius:999px;pointer-events:none"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="btn-face-camera" style="flex:1;padding:10px;border-radius:10px;background:#fff;border:1px solid #eef2f7">Aktifkan Kamera Selfie</button>
            <button id="btn-finish-kyc" style="padding:10px;border-radius:10px;background:#00D154;color:#fff;border:0">Selesaikan & Masuk</button>
          </div>
        </div>
      </section>

      <!-- MAIN LOBBY -->
      <main id="main-lobby" class="card hidden" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:12px;color:#6b7280">Maksimum Limit Kredit</div>
            <div id="display-limit" style="font-weight:900;font-size:22px">Rp 100.000.000</div>
          </div>
          <div>
            <button id="btn-tarik" style="background:#00D154;border:0;color:#fff;padding:10px;border-radius:10px">Tarik</button>
          </div>
        </div>

        <div style="height:16px"></div>

        <div style="background:#fff;border-radius:10px;padding:12px;border:1px solid #eef2f7;margin-top:6px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:800">Cicilan Gadget Pro</div>
              <div style="font-size:12px;color:#6b7280">Jatuh tempo: <span id="due-label">-</span></div>
            </div>
            <div style="text-align:right">
              <div id="bill-amount-display" style="font-weight:900">Rp 1.150.000</div>
              <button id="btn-bayar" style="margin-top:8px;background:#0f172a;color:#fff;padding:8px;border-radius:10px;border:0;font-size:12px">Bayar</button>
            </div>
          </div>
        </div>
      </main>
    </main>

    <!-- BOTTOM NAV (ensured present) -->
    <nav id="bottom-nav" style="background:#fff;padding:10px;border-top:1px solid #eef2f7;display:flex;justify-content:space-around">
      <button id="nav-home">Pinjaman</button>
      <button id="nav-kyc">Autentikasi</button>
      <button id="nav-profile">Saya</button>
    </nav>
  </div>

  <!-- MODAL -->
  <div id="action-modal" class="hidden" aria-hidden="true">
    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal" id="modal-inner">
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    (function(){
      // Defensive helper
      const $ = id => document.getElementById(id);
      const has = id => !!$(id);
      let currentLimit = 100000000;
      let currentBill = 1150000;
      let onboardCameraStream = null;
      let blinkDetectionInterval = null;
      let blinkFallbackTimer = null;
      let lastLuminance = 0;
      let isFaceMatched = false;
      let pendingVA = null;
      let vaTimer = null;

      const VA_BANKS = [
        { id:'bca', name:'BCA', prefix:'9901' },
        { id:'mandiri', name:'Mandiri', prefix:'9902' },
        { id:'bni', name:'BNI', prefix:'9903' }
      ];

      // Safe DOM ready init
      document.addEventListener('DOMContentLoaded', init);

      function init(){
        // Cache elements if present and attach safe event listeners
        safeOn('btn-send-otp','click', onSendOtp);
        safeOn('btn-verify-otp','click', onVerifyOtp);
        safeOn('btn-bypass','click', onBypass);
        safeOn('ktp-file','change', handleKtpFileUpload);
        safeOn('btn-ktp-camera','click', triggerOnboardKtpCamera);
        safeOn('btn-face-camera','click', triggerOnboardFaceCamera);
        safeOn('btn-finish-kyc','click', completeOnboardingAndEnterLobby);
        safeOn('btn-bayar','click', ()=> openModal('bayar'));
        safeOn('btn-tarik','click', ()=> openModal('tarik'));
        safeOn('btn-open-notif','click', ()=> alert('Notifikasi demo'));
        safeOn('nav-home','click', ()=> { showMain(); switchTab('home'); });
        safeOn('nav-kyc','click', ()=> { showMain(); switchTab('kyc'); });
        safeOn('nav-profile','click', ()=> { showMain(); switchTab('profile'); });

        // modal close on backdrop click
        const backdrop = document.querySelector('.modal-backdrop');
        if(backdrop) backdrop.addEventListener('click', (e)=> { if(e.target === backdrop) closeModal(); });

        // initial view
        showLoginFlow();
        updateDisplays();

        // Service worker registration — guarded (localhost or https)
        if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          navigator.serviceWorker.register('sw.js').catch(e => console.info('SW register failed', e));
        }
      }

      function safeOn(id, evt, fn){
        const el = $(id);
        if(el) el.addEventListener(evt, fn);
      }

      // NAV / views
      function showLoginFlow(){ hide('onboarding-flow'); hide('main-lobby'); show('login-flow'); hide('login-otp'); }
      function showOnboardingFlow(){ hide('login-flow'); hide('main-lobby'); show('onboarding-flow'); }
      function showMain(){ hide('login-flow'); hide('onboarding-flow'); show('main-lobby'); }

      function show(id){
        const el = $(id);
        if(el) el.classList.remove('hidden');
      }
      function hide(id){
        const el = $(id);
        if(el) el.classList.add('hidden');
      }

      // OTP
      function onSendOtp(){
        const phone = $('login-input-phone')?.value || '';
        if(!phone || phone.length < 6){ alert('Masukkan nomor HP valid'); return; }
        if($('login-otp')) $('login-otp').classList.remove('hidden');
        alert('Kode OTP 8888 terkirim (simulasi)');
      }
      function onVerifyOtp(){
        showOnboardingFlow();
        alert('Login berhasil (simulasi)');
      }
      function onBypass(){ completeOnboardingAndEnterLobby(); }

      // CAMERA & blink detection (defensive)
      function stopOnboardCamera(){
        if(onboardCameraStream){
          try{ onboardCameraStream.getTracks().forEach(t=>t.stop()); }catch(e){}
          onboardCameraStream = null;
        }
        stopBlinkDetector();
      }
      function stopBlinkDetector(){
        if(blinkDetectionInterval){ clearInterval(blinkDetectionInterval); blinkDetectionInterval = null; }
        if(blinkFallbackTimer){ clearTimeout(blinkFallbackTimer); blinkFallbackTimer = null; }
      }

      async function openCamera(videoEl, facingMode='user'){
        stopOnboardCamera();
        if(!videoEl){ alert('Elemen video tidak ditemukan'); return false; }
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert('Kamera tidak didukung di browser ini'); return false; }
        try{
          const constraints = { video:{ facingMode:{ ideal: facingMode }, width:{ideal:1280}, height:{ideal:720} }, audio:false };
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          onboardCameraStream = stream;
          videoEl.srcObject = stream;
          videoEl.muted = true;
          videoEl.setAttribute('playsinline','');
          try{ await videoEl.play(); }catch(e){}
          return true;
        }catch(err){
          console.warn('getUserMedia error', err);
          if(err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')){
            alert('Izin kamera ditolak. Aktifkan izin kamera pada pengaturan browser/OS.');
          } else {
            alert('Gagal membuka kamera: ' + (err && err.message ? err.message : err));
          }
          return false;
        }
      }

      async function triggerOnboardKtpCamera(){
        const video = $('onboard-ktp-video');
        if(!video) return;
        const ok = await openCamera(video,'environment');
        if(ok){
          const preview = $('onboard-ktp-preview');
          if(preview) preview.classList.add('hidden');
        }
      }

      async function triggerOnboardFaceCamera(){
        const video = $('onboard-face-video');
        if(!video) return;
        const ok = await openCamera(video,'user');
        if(ok) startBlinkDetector();
      }

      function startBlinkDetector(){
        stopBlinkDetector();
        const video = $('onboard-face-video');
        const canvas = $('face-analysis-canvas');
        if(!video || !canvas || !canvas.getContext){ simulateFallbackBlinkScan(); return; }
        const ctx = canvas.getContext('2d');
        blinkDetectionInterval = setInterval(()=>{
          if(!video.videoWidth || !video.videoHeight || isFaceMatched) return;
          canvas.width = 120; canvas.height = 120;
          try{ ctx.drawImage(video,0,0,120,120);}catch(e){ return; }
          const frame = ctx.getImageData(30,30,60,60);
          let total=0;
          for(let i=0;i<frame.data.length;i+=4) total += (frame.data[i]*0.299 + frame.data[i+1]*0.587 + frame.data[i+2]*0.114);
          const avg = total / (frame.data.length/4);
          if(lastLuminance>0 && (lastLuminance - avg) > 12) onBlinkDetected();
          lastLuminance = avg;
        },120);
        blinkFallbackTimer = setTimeout(()=>{ if(!isFaceMatched) onBlinkDetected(); },10000);
      }

      function simulateFallbackBlinkScan(){
        if(blinkFallbackTimer) clearTimeout(blinkFallbackTimer);
        blinkFallbackTimer = setTimeout(()=>{ if(!isFaceMatched) onBlinkDetected(); },3000);
      }

      function onBlinkDetected(){
        if(isFaceMatched) return;
        isFaceMatched = true;
        stopBlinkDetector();
        const oval = $('face-liveness-oval');
        if(oval) oval.style.borderColor = '#00D154';
        alert('Kedip terdeteksi — verifikasi wajah (simulasi) berhasil.');
      }

      // KTP upload
      function handleKtpFileUpload(e){
        const f = e && e.target && e.target.files && e.target.files[0];
        if(!f){ return; }
        const reader = new FileReader();
        reader.onload = function(evt){
          stopOnboardCamera();
          const img = $('onboard-ktp-preview');
          const vid = $('onboard-ktp-video');
          if(img){ img.src = evt.target.result; img.classList.remove('hidden'); }
          if(vid) try{ vid.classList.add('hidden'); }catch(e){}
          alert('e-KTP berhasil diunggah (simulasi OCR sukses).');
        };
        reader.readAsDataURL(f);
      }

      // Onboarding completion
      function completeOnboardingAndEnterLobby(){
        stopOnboardCamera();
        showMain();
        updateDisplays();
        alert('Verifikasi selesai (prototipe).');
      }

      // Modal utilities
      function setModal(html){
        const content = document.getElementById('modal-content');
        const backdrop = document.querySelector('.modal-backdrop');
        if(content) content.innerHTML = html;
        if(backdrop) backdrop.classList.remove('hidden');
      }
      function openModal(type){
        if(type === 'bayar'){ renderPayForm(); }
        else if(type === 'tarik'){ renderCashoutForm(); }
        const backdrop = document.querySelector('.modal-backdrop');
        if(backdrop) backdrop.classList.remove('hidden');
      }
      function closeModal(){
        const backdrop = document.querySelector('.modal-backdrop');
        if(backdrop) backdrop.classList.add('hidden');
        const content = document.getElementById('modal-content');
        if(content) content.innerHTML = '';
        if(vaTimer) clearInterval(vaTimer);
      }

      // Payment & VA (simulasi)
      function renderPayForm(){
        if(currentBill <= 0){
          setModal('<div style="text-align:center"><h3>Lunas</h3><p>Semua tagihan sudah lunas.</p><div style="margin-top:10px"><button onclick="closeModal()" style="padding:8px;border-radius:8px">Tutup</button></div></div>');
          return;
        }
        const bankButtons = VA_BANKS.map(b=>`<button onclick="createVA('${b.id}')" style="padding:8px;border-radius:8px;border:1px solid #eef2f7;margin-right:6px">${b.name}</button>`).join('');
        setModal(`<div><h3>Pembayaran Tagihan</h3><div style="background:#f8fafc;padding:10px;border-radius:8px;margin:8px 0"><div style="font-weight:800">${formatRp(currentBill)}</div></div><div>Pilih bank VA (prototipe):<div style="margin-top:8px">${bankButtons}</div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeModal()" style="flex:1;padding:10px;border-radius:8px">Batal</button><button onclick="createVA('bca')" style="flex:1;padding:10px;border-radius:8px;background:#00D154;color:white;border:0">Buat Kode VA</button></div></div>`);
      }

      function createVA(bankId){
        const bank = VA_BANKS.find(b=>b.id===bankId) || VA_BANKS[0];
        const tail = String(Math.floor(Math.random()*1e8)).padStart(8,'0');
        pendingVA = { bank, amount: currentBill, number: bank.prefix + '88' + tail, expiresAt: Date.now() + 24*3600*1000 };
        renderVA();
        alert('VA dibuat (fiktif) — salin dan gunakan untuk syuting.');
      }

      function renderVA(){
        if(!pendingVA){ renderPayForm(); return; }
        const v = pendingVA;
        setModal(`<div><h3>Selesaikan Pembayaran (VA fiktif)</h3><div style="margin-top:8px;background:#f8fafc;padding:10px;border-radius:8px"><div style="font-weight:800">${formatRp(v.amount)}</div><div style="font-family:monospace;margin-top:6px">${v.number}</div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="cancelVA()" style="flex:1;padding:10px;border-radius:8px">Ganti</button><button onclick="confirmVAPaid()" style="flex:1;padding:10px;border-radius:8px;background:#00D154;color:white;border:0">Saya Sudah Bayar</button></div><p style="font-size:12px;color:#6b7280;margin-top:8px">Properti film: kode VA fiktif, tidak terhubung ke bank manapun.</p></div>`);
        if(vaTimer) clearInterval(vaTimer);
        vaTimer = setInterval(()=>{
          if(!pendingVA){ clearInterval(vaTimer); return; }
          const s = Math.max(0, Math.floor((pendingVA.expiresAt - Date.now())/1000));
          const h = String(Math.floor(s/3600)).padStart(2,'0'), m=String(Math.floor(s%3600/60)).padStart(2,'0'), sec=String(s%60).padStart(2,'0');
          const content = document.getElementById('modal-content');
          if(content) {
            const title = content.querySelector('h3');
            if(title) title.innerText = `Selesaikan Pembayaran (VA fiktif) — sisa ${h}:${m}:${sec}`;
          }
          if(s<=0){ clearInterval(vaTimer); alert('VA kedaluwarsa'); pendingVA=null; renderPayForm(); }
        },1000);
      }

      function cancelVA(){ pendingVA=null; renderPayForm(); }
      function confirmVAPaid(){
        if(!pendingVA){ alert('Tidak ada VA aktif'); return; }
        currentBill = Math.max(0, currentBill - pendingVA.amount);
        currentLimit += pendingVA.amount;
        pendingVA = null;
        updateDisplays();
        closeModal();
        alert('Pembayaran dikonfirmasi (simulasi).');
      }

      // Cashout
      function renderCashoutForm(){
        setModal(`<div><h3>Pencairan Limit (Simulasi)</h3><div style="margin-top:8px"><label style="display:block;margin-bottom:6px">Nominal</label><input id="cashout-input" type="number" value="1000000" style="width:100%;padding:8px;border-radius:8px;border:1px solid #eef2f7" /></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeModal()" style="flex:1;padding:10px;border-radius:8px">Batal</button><button onclick="executeCashout()" style="flex:1;padding:10px;border-radius:8px;background:#0f172a;color:#fff">Cairkan</button></div></div>`);
      }
      function executeCashout(){
        const val = Number(document.getElementById('cashout-input')?.value || 0);
        if(val < 50000){ alert('Minimal pencairan Rp 50.000'); return; }
        if(val > currentLimit){ alert('Melebihi limit'); return; }
        currentLimit -= val;
        currentBill += val;
        updateDisplays();
        closeModal();
        alert('Pencairan berhasil (simulasi).');
      }

      // helpers
      function formatRp(n){ return 'Rp ' + Number(n).toLocaleString('id-ID'); }
      function updateDisplays(){
        if($('display-limit')) $('display-limit').innerText = formatRp(currentLimit);
        if($('bill-amount-display')) $('bill-amount-display').innerText = formatRp(currentBill);
      }

      function switchTab(tab){
        if(tab === 'home'){ }
        else if(tab === 'kyc'){ showOnboardingFlow(); }
        else if(tab === 'profile'){ alert('Profile (demo)'); }
      }

      document.addEventListener('visibilitychange', ()=> { if(document.hidden) stopOnboardCamera(); });

      window.createVA = createVA;
      window.cancelVA = cancelVA;
      window.confirmVAPaid = confirmVAPaid;
      window.closeModal = closeModal;
      window.openModal = openModal;
      window.completeOnboardingAndEnterLobby = completeOnboardingAndEnterLobby;
    })();
  </script>
</body>
</html>
